name: Bug Report
description: Non-security related issues regarding this UDUNITS-2
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time to fill out this bug report! If you have a question, suggestion, or feature request, please use the project [GitHub Discussions forum](https://github.com/Unidata/UDUNITS-2/discussions).
  - type: textarea
    id: versions
    attributes:
      label: Versions impacted by the bug
      description: Which version(s) of UDUNITS-2 are impacted by this bug? If you have only tried with one version, that is ok!
  - type: textarea
    id: report-details
    attributes:
      label: What went wrong?
      placeholder: Please describe the bug!
      value: "Please describe the bug."
    validations:
      required: true
  - type: textarea
    id: stack_trace
    attributes:
      label: Relevant stack trace
      description: Please copy and paste the plain text of any relevant stack trace (this content be converted to a code block).
      render: shell
  - type: textarea
    id: log_messages
    attributes:
      label: Relevant log messages
      description: Please copy and paste any relevant log messages.
    validations:
      required: true
  - type: checkboxes
    id: terms
    attributes:
      label: Code of Conduct
      description: By submitting this report, you agree to follow the UCAR/Unidata [Code of Conduct](https://github.com/Unidata/.github/blob/main/CODE_OF_CONDUCT.md)
      options:
        - label: I agree to follow the UCAR/Unidata Code of Conduct
          required: true